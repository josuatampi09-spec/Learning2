<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Academy - 20 Modul PPLG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-rocket"></i> Nexus Academy
        </div>
        <div class="nav-right">
            <div class="xp-badge">
                <i class="fas fa-star"></i> <span id="xpCounter">0</span> XP
            </div>
            <button class="btn-icon" id="darkModeToggle" title="Ganti Tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="courseProgress" style="width: 0%;"></div>
    </div>

    <main class="container">
        <div class="intro-header fade-in">
            <h1>Jalur Pembelajaran PPLG Fase E</h1>
            <p>Selesaikan 20 misi mini-kuis ini secara berurutan untuk menjadi seorang Junior Programmer!</p>
        </div>

        <!-- Wadah Kosong: Modul ke-1 sampai 20 akan dimunculkan di sini oleh JavaScript secara otomatis -->
        <div id="moduleContainer"></div>

        <div id="achievementNotif" class="achievement hidden">
            <i class="fas fa-medal"></i>
            <div>
                <h4>Level Up!</h4>
                <p id="achievementText">Anda mendapatkan XP.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
